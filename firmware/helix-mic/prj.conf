# Helix-Mic Configuration

# Main config — increased for BLE stability
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Helix-Mic"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CONN_TX_MAX=16

# BLE stack
CONFIG_BT_RX_STACK_SIZE=4096

# BLE GATT
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_MTU=247

# BLE Security — encrypted link required for audio/battery access
CONFIG_BT_SMP=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Audio - Zephyr DMIC API (nRF PDM driver)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_NRFX_PDM=y

# ADC for battery
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

# GPIO for LEDs
CONFIG_GPIO=y

# Logging over USB CDC ACM (board has zephyr,cdc-acm-uart node)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# Ring buffer for audio pipeline
CONFIG_RING_BUFFER=y

# Heap for audio buffers
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Clock
CONFIG_CLOCK_CONTROL_NRF=y

# Power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Debug
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y

# Newlib for memcpy etc
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
